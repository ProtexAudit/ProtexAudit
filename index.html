<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PROTEX | Smart Contract Security Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <img src="logo.png" alt="PROTEX Logo">
  </div>
  <div class="nav-title">PROTEX</div>
</nav>

<section class="hero">
  <h1>Multi-Chain Smart Contract Security Intelligence</h1>
  <p>Verify tokens, analyze risk, detect scams, and explore blockchain transparency.</p>

  <div class="search-box">
    <select id="chain">
      <option value="ethereum">Ethereum</option>
      <option value="bsc">BNB Smart Chain</option>
      <option value="polygon">Polygon</option>
      <option value="arbitrum">Arbitrum</option>
      <option value="base">Base</option>
    </select>
    <input type="text" id="contract" placeholder="Enter Contract Address">
    <button onclick="checkToken()">Analyze</button>
  </div>
</section>

<section id="result" class="result"></section>

<script src="script.js"></script>
</body>
</html>
